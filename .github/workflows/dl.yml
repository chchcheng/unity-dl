name: dl-hub
on: push
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download intl Hub
        run: |
          wget -q "https://public-cdn.cloud.unity3d.com/hub/prod/UnityHubSetup.exe" -O UnityHubSetup_intl.exe
          ls -la UnityHubSetup_intl.exe
      - name: Upload Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2 UnityHubSetup_intl.exe --repo ${{ github.repository }} --title "intl hub" --notes "intl hub installer"
